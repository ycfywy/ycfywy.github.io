<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">一份收入的构成</title><desc id="desc">收入、时间、成本与保障共同决定一份工作的实际价值。</desc><rect width="1200" height="630" fill="#e8eee8"/><circle cx="1000" cy="125" r="120" fill="#d5e5d8"/><circle cx="160" cy="520" r="145" fill="#d7e2d9"/><text x="90" y="105" font-family="sans-serif" font-size="39" fill="#213d39">赚钱到底难不难？</text><text x="92" y="155" font-family="sans-serif" font-size="23" fill="#617970">看看数字，也看看数字背后的生活</text><g font-family="sans-serif" text-anchor="middle"><rect x="75" y="230" width="235" height="200" rx="24" fill="#fff"/><rect x="345" y="230" width="235" height="200" rx="24" fill="#fff"/><rect x="615" y="230" width="235" height="200" rx="24" fill="#fff"/><rect x="885" y="230" width="235" height="200" rx="24" fill="#fff"/><g fill="#739986" font-size="52"><text x="192" y="320">¥</text><text x="462" y="320">◷</text><text x="732" y="320">−</text><text x="1002" y="320">✚</text></g><g fill="#29463f" font-size="27"><text x="192" y="383">收入</text><text x="462" y="383">时间</text><text x="732" y="383">成本</text><text x="1002" y="383">保障</text></g></g><text x="600" y="528" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#627b70">一份工资的价值，从来不止一个数字</text></svg>
